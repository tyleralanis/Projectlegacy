name: Publish OTA update

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      channel:
        description: Compatible update channel
        type: choice
        options:
          - preview
          - production
        default: preview
      message:
        description: Release note
        required: true
        default: Game content and interface update

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Publish compatible OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'production' }}
          MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || 'TestFlight alpha fixes and offline action improvements' }}
        run: pnpm dlx eas-cli@22.0.0 update --channel "$CHANNEL" --environment "$CHANNEL" --message "$MESSAGE" --non-interactive
